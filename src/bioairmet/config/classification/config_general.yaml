# =============================================================================
# BioAirMet - Stage 2: supervised classification fine-tuning (template)
#
# QUICK START
#   1. Fill in every "CHANGE ME" field below.
#   2. Dry-run check (prints the fully resolved config + a CHANGE-ME
#      checklist, then exits; no training, no side effects):
#        bioairmet-train --config_path <this file> --mode classification --show_config
#   3. Launch:
#        bash run_classification_training.sh          # uses this file by default
#      or with your own copy of the config:
#        bash run_classification_training.sh /path/to/your_cls_config.yaml
#
# HOW THIS FILE IS ORGANIZED
#   The sections always appear in this order (same layout as the SSL template):
#     RUN -> DATA -> MODEL INITIALIZATION -> ARCHITECTURE -> TRAINING
#         -> OUTPUT -> DISTRIBUTED  (+ a LEGACY "test" section at the end)
#   Within each section: USER SETTINGS first (fields you normally edit),
#   ADVANCED last (tuned defaults; change them only if you know why).
#
# IMPORTANT: architecture lock
#   When model_initialization.pretraining.enable is True, the model
#   architecture is NOT taken from the package template. It is PINNED to the
#   SSL experiment you point at with model_initialization.pretraining
#   .experiment_path :
#     <that dir>/architecture.yaml defines the exact model shape the SSL
#     weights were trained with, and is deep-merged over this file at startup.
#   Do not try to re-configure the model shape here; change the SSL stage.
#   (When training from scratch, the architecture comes from
#   architecture_setup.architecture_config_name below instead.)
# =============================================================================

# -----------------------------------------------------------------------------
# RUN
# -----------------------------------------------------------------------------
project_name: "Classification_EffB0_LegacyImgReader_Linearclassifier"  # used in the experiment folder and log names
seed: 42

# -----------------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------------
data:
  # --- USER SETTINGS -------------------------------------------------------
  train_data_path: /path/to/your/train_data.h5  # CHANGE ME (labeled HDF5, train split)
  validation_path: /path/to/your/test_data.h5  # CHANGE ME (labeled HDF5, validation split)
  # Category map (integer class id -> name). The package ships a default one;
  # CHANGE ME if your dataset uses different categories.
  cat_map_path: src/bioairmet/config/classification/cats_dict.txt

  # --- ADVANCED ------------------------------------------------------------
  # name of the image column in the h5 file, if img_count_per_sample=2, this
  # should contain a list of two image paths for each sample otherwise a single image path
  image_column_name: "images" # name of the image column in the h5 file
  # name of the fluorescence spectra column in the h5 file, relative_spectra is
  # already extracted from the json file in (3, 5) shape
  fluorescence_spectra_column_name: "relative_spectra"
  category_number_column_name: "category_num" # integer e.g. 0,1 ...
  category_string_column_name: "category" # string e.g. Betula, Fraxinus ...

  # General image settings
  # image resolution, images will be resized to this size during data loading if not already in this size.
  # This is the resolution used for model input. Grayscale images are expected.
  image_size: 200 # square image size (height and width)
  #### -----
  # If True (and the SSL stage used stitch_images: True), the two images are
  # stitched to make one and used for training and testing.
  # This is dependent on the SSL stage, there should be also True
  stitch_images: False
  #### -----
  img_reader_type: 'legacy' # MUST match SSL training! Options: 'legacy' | 'minmax' | 'global'
                           #   legacy : 16-bit -> per-image min-max -> 8-bit PIL -> ToTensor [0,1]
                           #   minmax : per-image min-max on the float tensor -> [0,1]
                           #   global : divide by the file's full scale (16-bit /65535, 8-bit /255)
  image_normalization:
    enable: False # True or False to enable/disable image normalization
    # mean and std for image normalization, used if image_normalization.enable is True
    img_mean: [0.883232]
    img_std: [0.139312]

  augmentation:
    # image augmentation settings
    img_aug_prob: 0.5 # Probability for image augmentations
    legacy_img_aug: True # True = fixed hard-coded legacy pipeline (flips + rotation ±25° + translate 5% +
                        # colour-jitter 0.7 @ p0.8 + gaussian-blur 0.1-2.5 @ p0.5; the image_transforms
                        # block below is ignored); False = build the pipeline from the image_transforms
                        # block (missing/empty block = no augmentation)
    # --- Custom-mode per-transform image augmentation (used only when legacy_img_aug is False) ---
    #     flipping  = horizontal_flip / vertical_flip
    #     rotation  = angle (degrees) + translation (fraction of width/height)
    #     speckle_noise / gamma_correction / cutout = pixel ops tailored to this
    #       hologram corpus (200x200 grayscale, particle centered); the cutout
    #       only erases a small rectangle outside the protected central disk
    #       (clear_center * image/2), filled with the fill colour.
    # Each entry is { enabled: true/false, prob: p, ...params }.
    # color_jitter also accepts saturation / hue.
    image_transforms:
      parallel_flipping_rotation: false # true = one shared flip/rotation decision for both
                                        # views of an image pair (custom mode only; ignored in legacy mode)
      fill: 'border' # Colour of the pixels revealed by rotation/translation/affine,
                    # in both modes, and by the cutout in custom mode.
                    # 'border' (default): median of each image's outer 1-pixel
                    # ring, computed per image at call time, so the exposed
                    # edge matches the image's own edge colour.
                    # Also: 'white' (the corpus background), 'black',
                    # or a number in [0, 1] (tensor domain).
      horizontal_flip: 
        enabled: true
        prob: 0.5
      vertical_flip:   
        enabled: true
        prob: 0.5
      rotation:
        enabled: false
        prob: 0.5
        angle: 180                    # rotation angle (degrees)
        translation: [0.05, 0.05]     # translation (dx, dy)
      color_jitter:
        enabled: true
        prob: 0.5
        brightness: 0.5
        contrast: 0.5
      gaussian_blur:
        enabled: true
        prob: 0.5
        kernel_size: 3
        sigma: [0.1, 2.0]
      gaussian_noise:
        enabled: true
        prob: 0.5
        std: 0.05
      speckle_noise:
        enabled: false                # off by default - set to true to enable
        prob: 0.3
        sigma: 0.04                   # multiplicative speckle: img * (1 + sigma * N(0,1))
      gamma_correction:
        enabled: false                # off by default - set to true to enable
        prob: 0.3
        gamma: [0.8, 1.2]             # img ** g with g drawn uniformly from [lo, hi]
      cutout:
        enabled: false                # off by default - set to true to enable
        prob: 0.2
        count: [1, 4]                 # how many squares are erased per draw (1 = a single square)
        size: [0.02, 0.05]            # erased square as a fraction of the image width (4-10 px at 200 px)
        clear_center: 0.6             # nothing within 0.6 * (image/2) = 60 px of the center is ever erased
        
    # fluorescence data augmentation settings
    fluo_aug_prob: 0.5 # Probability for fluorescence data augmentations
    fluo_augment_style: "covariance_style_augmentation" # Options: "pca_jitter" (alias: "pca"), "covariance_style_augmentation", null (disable)
    fluo_pca_std: 0.1 # Jitter magnitude (std) used by the "pca_jitter" fluorescence augmentation
# -----------------------------------------------------------------------------
# MODEL INITIALIZATION
# -----------------------------------------------------------------------------
# Where the starting weights come from. Enable one of the options below:
#
# 1) Fine-tune from a Stage-1 SSL model (recommended):
#      pretraining.enable: True,  mode: "ssl_pretraining"
#    The head starts random; the encoders load from the SSL experiment.
#    Protect the pretrained weights with a SMALL encoder LR multiplier
#    (~0.001 in train.fine_tuning) and ~1.0 for the head.
#
# 2) Transfer from a previous classification model (small datasets):
#      pretraining.enable: True,  mode: "classification_finetuning"
#    Loads encoders and head from that experiment; use a very small LR.
#
# 3) Train from scratch:
#      pretraining.enable: False
#    Nothing is loaded and the whole model trains end to end. Set the encoder
#    LR multipliers in train.fine_tuning to ~1.0 (NOT the 0.001 fine-tuning
#    default). The architecture then comes from architecture_config_name
#    below, not from any experiment directory.
#
# Resuming an interrupted classification run (mutually exclusive with
# pretraining): resume.enable: True + resume.checkpoint_path; the
# architecture is reconstructed from that experiment's architecture.yaml.
model_initialization:
  pretraining:
    enable: True  # False => "train from scratch" (option 3 above)
    # "ssl_pretraining" or "classification_finetuning"
    mode: "ssl_pretraining"
    # CHANGE ME: path to the SSL experiment directory (contains config.yaml,
    # architecture.yaml and *.pth). The architecture is loaded from THIS dir.
    # ignored when enable: False (train-from-scratch).
    experiment_path: "/path/to/your/ssl_experiment_dir"
    weights: "last"  # 'best' or 'last': which checkpoint to load from the SSL experiment

  resume:
    enable: False  # True => resume mode (mutually exclusive with pretraining)
    checkpoint_path: null  # e.g. /path/to/your/experiment/last_classification_model.pth

# -----------------------------------------------------------------------------
# ARCHITECTURE
# -----------------------------------------------------------------------------
architecture_setup:
  # Architecture file in src/bioairmet/config/architecture/, used only when
  # model_initialization.pretraining.enable is False (train from scratch).
  # When pretraining is enabled, the architecture is PINNED to the SSL
  # experiment bundle and this name is ignored.
  architecture_config_name: "architecture_base.yaml"

  # Classification head (the backbones come from the SSL bundle)
  classification_model:
    name: "HoloClassifierV2" # Do not change this unless you know what you're doing; the builder expects this name.
    num_classes: 35  # CHANGE ME if your dataset has a different number of classes
    classifier_type: "one_layer" # "one_layer" or "two_layers"
    classifier_layernorm: False # Whether to use LayerNorm in the classifier head (applies to both one_layer and two_layers)
    classifier_hidden_dim: 512 # when two_layers classifier is used
    classifier_dropout: 0.0 # when layernorm/two_layers is used
    feature_l2_normalization_enabled: True # L2-normalize features after the encoders
    # Speed: when the image encoder is fully frozen and in eval() mode, view_a and
    # view_b are encoded in one concatenated forward pass instead of two (roughly
    # halves the image-encoder launches of a training step). Bit-for-bit identical
    # to two separate calls, and switched off
    # automatically as soon as any part of the image encoder is trainable or in
    # train mode (e.g. update_batchnorm_stats_img_encoder: true).
    fuse_frozen_image_views: False 

# -----------------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------------
train:
  # --- USER SETTINGS -------------------------------------------------------
  epochs: 50 # Reverted epochs
  batch_size: 64
  num_workers: 12

  # --- ADVANCED ------------------------------------------------------------
  optimizer:
    name: "AdamW"
    lr: 0.001
    weight_decay: 0.001

  # Learning-rate scheduler. Set name: "None" to disable scheduling.
  # Other available schedulers and their parameters: docs/configuration.md
  #
  # STEP-BASED schedulers (CLIPCosineWarmupScheduler, OneCycleLR) are advanced once
  # per OPTIMISER update, and their length is derived automatically as
  #   total_steps = epochs * ceil(steps_per_epoch / gradient_accumulation_steps)
  # so the decay always finishes exactly at the last epoch (the log prints
  # "[scheduler] ... total_steps=..."). Set total_steps only to force an absolute
  # count, e.g. when resuming in the middle of a run.
  scheduler:
    name: "CosineAnnealingLR"
    T_max: 50 # epoch-wise scheduler: keep equal to train.epochs
    eta_min: 0.00000001 # Minimum learning rate
    # total_steps: null # absolute override, only used by step-based schedulers

  loss:
    name: "CrossEntropyLoss" # Other option (see docs/configuration.md): FocalLoss_gt_Corrected
    label_smoothing: 0.0  # Prevents overconfident predictions, improves OOD generalization
    gamma: 2.0  # Used by FocalLoss_gt_Corrected (ignored by CrossEntropyLoss)
    # alpha: "auto"  # FocalLoss only: derive per-class weights from the
                     # training set's class imbalance (inverse frequency,
                     # sum-normalised; persisted in the experiment config).
                     # An explicit scalar / list of num_classes values also
                     # works for full manual control.

  early_stopping:
    patience: 100
    min_delta: 0.0001

  gradient_accumulation_steps: 1 # >1 = N micro-batches per optimiser update. The
                                 # last (partial) window of an epoch is still applied,
                                 # so updates/epoch = ceil(steps_per_epoch / this value)
  mixed_precision: False # Enabled for performance

  # --- THROUGHPUT SWITCHES ----------------------------------------------------
  # All three default to OFF in code; this template turns the first two on.
  # Measured during development (batch 64, 200x200, EfficientNet v2_100k,
  # forward+backward):
  #   fp32 NCHW 17.2k -> fp32 NHWC 21.2k -> AMP NCHW 21.3k -> AMP NHWC 36.3k img/s
  cudnn_benchmark: False # cuDNN auto-tunes conv algorithms. Worth it here because
                        # every step uses the same (fixed) input size; the price is a
                        # slower first pass and re-tuning if shapes change.
  tf32: False # TF32 for fp32 matmul/conv on Ampere+ GPUs. Consistent with AMP being
             # on; set False if you need full fp32 mantissa precision.
  channels_last: False # NHWC memory format for model + inputs (biggest win on these
                       # small conv nets, see numbers above). Left off by default so
                       # results stay comparable with previous NCHW runs.

  gradient_clipping:
    enable: True # Set to True to enable gradient clipping
    # when enabled, the following settings determine how to perform gradient clipping:
    clipping_mode: "fixed" # options: "adaptive", "step_scaling", "fixed".
    # when mode : 'adaptive' it uses 1/scaler for clipping
    # mode : 'fixed'
    clip_value: 1.0 # The maximum norm of the gradients when clipping mode is fixed

  gradient_regularization:
    enable: False # Set to True to enable gradient normalization
    norm_mode: "gradient_noise" # options: "gradient_noise", "l2_norm", "linf_norm", "img_encoder_grad_down_scaling"
    # mode: "l2_norm", Maximum norm for L2 normalization, adjust based on observed gradient norms to prevent collapse while allowing effective learning
    max_norm: 1.0 # Maximum norm for gradient normalization
    # better to be used when clipping is fixed.
    # mode: "gradient_noise", Standard deviation of the noise to add to gradients, adjust based on observed training dynamics to prevent collapse while allowing effective learning
    noise_std: 0.00001 #1e-5 # mode: "gradient_noise", Standard deviation of the noise to add to gradients
    # mode: "img_encoder_grad_down_scaling", Whether to scale down image encoder gradients, this is a simple way to prevent collapse by reducing the learning rate for the image encoder while allowing the rest of the model to learn effectively. Adjust the scaling factor based on observed training dynamics.
    imgEnc_grad_scale: 0.1 # mode: "img_encoder_grad_down_scaling", Scaling factor for image encoder gradients when scale_down_imgEnc_grads is True
    # mode: "step_scaling", Maximum allowed step size for gradients, adjust based on observed gradient norms to prevent collapse while allowing effective learning
    grad_scale: 0.0001 #3 # 3e-5 # Gradient scaling factor for "step_scaling" clipping mode, adjust based on observed gradient norms to prevent collapse while allowing effective learning

  fine_tuning:
    bn_bias_no_decay: False # Whether to exclude BatchNorm and bias parameters from weight decay
    # NOTE: frozen encoders are automatically held in eval() mode with their
    # BatchNorm running statistics frozen (no config needed for this).
    #
    # LEARNING RATE BY INITIALIZATION MODE:
    #   - Fine-tune from SSL   (pretraining.enable: True)  :
    #       encoder LR multiplier ~0.001 (protect pretrained weights), head ~1.0.
    #   - Train from scratch   (pretraining.enable: False) :
    #       encoder LR multiplier ~1.0 (random init needs a full LR), head ~1.0.
    #     The unfreeze_* flags below are auto-set to True in this mode by the
    #     builder, and a warning is printed if the multipliers are left at the
    #     fine-tuning default of 0.001.

    unfreeze_image_encoder: False # True -> full end-to-end fine-tuning of the image encoder (auto-True when training from scratch)
    unfreeze_fluorescence_encoder: False # True -> full end-to-end fine-tuning of the fluorescence encoder (auto-True when training from scratch)
    # if img_encoder is unfreezed
    image_encoder_lr_multiplier: 1.0  #(use ~1.0 when training from scratch)
    # if fluorescence_encoder is unfreezed
    fluorescence_encoder_lr_multiplier: 1.0  #(use ~1.0 when training from scratch)
    classifier_lr_multiplier: 1.0
    # Partial fine-tuning: unfreeze only the last N layer units of the encoder
    # (0/False -> disabled; used when the corresponding unfreeze_*_encoder
    # flag above is False). Granularity depends on the backbone: e.g. 1 =
    # head only for EfficientNet, conv5 for ShuffleNet, final Linear for the MLP.
    unfreeze_last_fl_layers: False # Number of last layers to unfreeze (if applicable)
    unfreeze_last_img_layers: False # Number of last layers to unfreeze (if applicable)
    # BatchNorm controls (independent of unfreeze_{image,fluorescence}_encoder;
    # see docs/configuration.md). BN has two kinds of state:
    #   * running stats (running_mean/var): buffers updated in the forward pass,
    #     never trained -> toggled by update_batchnorm_stats_*
    #   * affine weight/bias: trainable Parameters -> toggled by
    #     train_batchnorm_affine_* (added to the optimizer)
    # unfreeze_batchnorm_* is a convenience "both" shortcut (stats + affine).
    update_batchnorm_stats_img_encoder: False # image encoder BN running stats adapt to the new data (no trainable params)
    update_batchnorm_stats_fl_encoder: False # fluorescence encoder BN running stats adapt (no trainable params)
    train_batchnorm_affine_img_encoder: False # image encoder BN affine weight/bias trainable
    train_batchnorm_affine_fl_encoder: False # fluorescence encoder BN affine weight/bias trainable
    unfreeze_batchnorm_img_encoder: False # "both": image encoder BN running stats update + affine trainable
    unfreeze_batchnorm_fl_encoder: False # "both": fluorescence encoder BN running stats update + affine trainable
    # With ALL six BatchNorm flags above False, a frozen encoder normalises with
    # its PRETRAINED running statistics (eval() + track_running_stats=True):
    # deterministic and identical to the SSL-pretraining features. Turn on
    # update_batchnorm_stats_* only to re-estimate (overwrite) the stats on the
    # fine-tuning data (AdaBN); note this also switches the training forward to
    # per-batch statistics and can hurt accuracy on small datasets.
# -----------------------------------------------------------------------------
# OUTPUT / LOGGING
# -----------------------------------------------------------------------------
logging:
  # Root output directory; each run creates
  # <checkpoint_dir>/<timestamp>_<project_name>/ with checkpoints, config.yaml,
  # architecture.yaml and logs/
  checkpoint_dir: "/path/to/your/classification_checkpoints"  # CHANGE ME
  # Write TensorBoard event files into the experiment directory
  tensorboard: False

# -----------------------------------------------------------------------------
# DISTRIBUTED (GPUs)
# -----------------------------------------------------------------------------
# The launcher script (run_classification_training.sh) controls which GPUs are
# VISIBLE via its GPU_IDS variable (CUDA_VISIBLE_DEVICES). With the defaults
# below, training uses every GPU the script makes visible; no extra syncing
# needed. To pin a single specific GPU, set: world_size: 1  +  gpu_ids: [0]
# (gpu_ids are indices into the visible GPUs, i.e. into the script's GPU_IDS).
distributed:
  enable: False # Set to True for DistributedDataParallel training
  world_size: 1 # -1 = all visible GPUs, 1 = single GPU, or a specific number
  gpu_ids: [0] # Visible GPU indices to use (e.g. [0, 1]); empty = all visible GPUs
  master_addr: "localhost"
  master_port: "11059"
